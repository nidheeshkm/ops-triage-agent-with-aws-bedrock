version: 1  # required by Python's logging config format
disable_existing_loggers: false  # keep Strands and boto3 loggers working
formatters:
  standard:
    format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"  # time, level, logger name, message
handlers:
  console:
    class: logging.StreamHandler  # print to the terminal; in AgentCore, output goes to CloudWatch
    formatter: standard
root:
  level: INFO  # show INFO and above
  handlers: [console]